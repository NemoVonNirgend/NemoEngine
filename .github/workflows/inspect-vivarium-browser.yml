name: Inspect Vivarium rendered assets

on:
  push:
    branches:
      - automation/vivarium-banner
    paths:
      - ".github/workflows/inspect-vivarium-browser.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null
      - name: Inspect rendered preset page
        shell: bash
        run: |
          cat > inspect-vivarium.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const url = 'https://plotlightstudios.com/discovery/presets/@nemovonnirgend/nemo-vivarium-v10-beta';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext();
          const page = await context.newPage();
          const interesting = [];

          page.on('response', async response => {
            const u = response.url();
            const ct = response.headers()['content-type'] || '';
            if (/image|json|api|preset|storage|supabase|asset|upload/i.test(`${u} ${ct}`)) {
              let body = '';
              try {
                if (/json|text/i.test(ct)) body = (await response.text()).slice(0, 100000);
              } catch {}
              interesting.push({ url: u, status: response.status(), contentType: ct, body });
            }
          });

          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 90000 });
          await page.waitForTimeout(15000);

          const images = await page.locator('img').evaluateAll(nodes => nodes.map(img => ({
            src: img.currentSrc || img.src,
            alt: img.alt,
            width: img.naturalWidth,
            height: img.naturalHeight
          })));
          const resources = await page.evaluate(() => performance.getEntriesByType('resource').map(e => e.name).filter(u => /image|storage|supabase|upload|asset|preset/i.test(u)));
          const text = await page.locator('body').innerText().catch(() => '');

          fs.writeFileSync('vivarium-browser-report.json', JSON.stringify({ title: await page.title(), images, resources, interesting, text: text.slice(0, 30000) }, null, 2));
          await browser.close();
          JS
          node inspect-vivarium.mjs
      - name: Commit browser report
        shell: bash
        run: |
          rm -rf node_modules package.json package-lock.json inspect-vivarium.mjs
          git config user.name NemoVonNirgend
          git config user.email 207980572+NemoVonNirgend@users.noreply.github.com
          git add vivarium-browser-report.json
          git commit -m "Inspect Vivarium rendered assets"
          git push
