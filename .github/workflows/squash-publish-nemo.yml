name: Squash publish Nemo Engine 11.5.1

on:
  push:
    branches:
      - automation/nemo-11.5.1-final
    paths:
      - '.github/workflows/squash-publish-nemo.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary publisher from branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name NemoVonNirgend
          git config user.email 207980572+NemoVonNirgend@users.noreply.github.com
          git rm '.github/workflows/squash-publish-nemo.yml'
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git commit -m 'Remove temporary Nemo publisher'
          git push
      - name: Squash merge verified preset into main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo NemoVonNirgend/NemoEngine --head automation/nemo-11.5.1-final --base main --state open --json number --jq '.[0].number')"
          test -n "$pr"
          gh pr merge "$pr" --repo NemoVonNirgend/NemoEngine --squash --delete-branch
