name: Publish Nemo Engine 11.5.1 from v11.3 delta

on:
  push:
    branches:
      - automation/nemo-11.5.1-delta
    paths:
      - ".github/workflows/publish-nemo-11.5.1-delta.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Rebuild and validate exact preset
        shell: bash
        run: |
          set -euo pipefail

          base="Nemo Engine/Archive/Nemo Engine v11.3.json"
          target="Nemo Engine/Nemo Engine 11.5.1 - General RP.json"
          patch="/tmp/nemo-11.5.1.patch.zst"

          test "$(sha256sum "$base" | cut -d' ' -f1)" = "3a94d58360ae21da24131808e8b095b3e62f4599ea62615c9c95d0ccfb1fdad2"

          cat .staging/nemo-11.5.1-delta/part-* | base64 --decode > "$patch"
          test "$(sha256sum "$patch" | cut -d' ' -f1)" = "e39715ebbc6850e69b32adb33025c39a46a13e28af1c5576c554b6dd779b1d12"

          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd

          zstd -d --patch-from="$base" "$patch" -o "$target"

          test "$(sha256sum "$target" | cut -d' ' -f1)" = "cd80c997cef21bc393d2f5462474b30e80ea765216c3f7fb5841c3a682aa9429"
          test "$(git hash-object "$target")" = "e8b4e950e5566a9ad1d2043b7b4d4a5b3055652c"

          python - <<'PY'
          import collections
          import json

          path = "Nemo Engine/Nemo Engine 11.5.1 - General RP.json"
          with open(path, encoding="utf-8") as handle:
              data = json.load(handle)

          assert data["preset_name"] == "Nemo Engine v11.5.1"
          prompts = data["prompts"]
          identifiers = [item["identifier"] for item in prompts]
          assert len(prompts) == 451
          assert len(data["prompt_order"]) == 2
          assert not [key for key, count in collections.Counter(identifiers).items() if count > 1]

          known = set(identifiers)
          for profile in data["prompt_order"]:
              for item in profile["order"]:
                  assert item["identifier"] in known

          assert "Base: v11.3 + Magpie systems" in data["nemo_merge_note"]
          PY

      - name: Commit published preset and remove staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .staging/nemo-11.5.1-delta
          rm -f .github/workflows/publish-nemo-11.5.1-delta.yml

          git config user.name "NemoVonNirgend"
          git config user.email "207980572+NemoVonNirgend@users.noreply.github.com"

          git add -A
          git commit -m "Publish Nemo Engine v11.5.1"
          git push
