name: Export exact Magpie preset

on:
  push:
    branches:
      - automation/magpie-json
    paths:
      - ".github/workflows/export-magpie-json.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser tooling
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null
      - name: Inspect every public export choice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p magpie-export-candidates
          cat > export-magpie.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const url = 'https://plotlightstudios.com/discovery/presets/@nemovonnirgend/magpie-v1-beta-21';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ acceptDownloads: true });
          const page = await context.newPage();
          const report = [];
          const responses = [];

          page.on('response', async response => {
            const responseUrl = response.url();
            const type = response.headers()['content-type'] || '';
            if (/json|api|preset|storage|supabase|download|export/i.test(`${responseUrl} ${type}`)) {
              let body = '';
              try {
                if (/json|text/i.test(type)) body = (await response.text()).slice(0, 200000);
              } catch {}
              responses.push({ url: responseUrl, status: response.status(), contentType: type, body });
            }
          });

          await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 90000 });
          await page.waitForTimeout(12000);
          report.push(`TITLE: ${await page.title()}`);
          report.push(`BODY BEFORE EXPORT:\n${(await page.locator('body').innerText()).slice(0, 30000)}`);

          async function visibleControls(stage) {
            const controls = await page.locator('button, a, [role="button"]').evaluateAll(nodes => nodes.map((node, index) => ({
              index,
              tag: node.tagName,
              text: (node.textContent || '').trim(),
              aria: node.getAttribute('aria-label'),
              title: node.getAttribute('title'),
              href: node.href || null,
              visible: !!(node.offsetWidth || node.offsetHeight || node.getClientRects().length)
            })).filter(item => item.visible));
            report.push(`${stage}:\n${JSON.stringify(controls, null, 2)}`);
            return controls;
          }

          await visibleControls('CONTROLS BEFORE EXPORT');
          const exportButton = page.locator('button, a, [role="button"]').filter({ hasText: /^\s*Export Preset\s*$/i }).first();
          if (!(await exportButton.count())) throw new Error('Export Preset control was not found');
          await exportButton.click({ timeout: 15000 });
          await page.waitForTimeout(1200);
          const after = await visibleControls('CONTROLS AFTER EXPORT');
          report.push(`BODY AFTER EXPORT:\n${(await page.locator('body').innerText()).slice(0, 40000)}`);

          const candidateTexts = after
            .map(item => item.text)
            .filter(text => text && /silly|tavern|rolecall|original|source|json|download|export/i.test(text));
          report.push(`CANDIDATE LABELS: ${JSON.stringify(candidateTexts)}`);

          let downloadIndex = 0;
          for (const label of [...new Set(candidateTexts)]) {
            if (/^export preset$/i.test(label)) continue;
            let control = page.locator('button, a, [role="button"]').filter({ hasText: new RegExp(`^\\s*${label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s*$`, 'i') }).first();
            if (!(await control.count())) continue;
            report.push(`TRYING: ${label}`);
            const pending = page.waitForEvent('download', { timeout: 15000 }).catch(() => null);
            await control.click({ timeout: 15000 }).catch(error => report.push(`CLICK ERROR ${label}: ${error}`));
            const download = await pending;
            if (download) {
              const clean = download.suggestedFilename().replace(/[^a-zA-Z0-9._ -]+/g, '_');
              const destination = path.join('magpie-export-candidates', `${String(downloadIndex).padStart(2, '0')}-${clean}`);
              await download.saveAs(destination);
              report.push(`DOWNLOADED ${label}: ${destination}`);
              downloadIndex += 1;
            } else {
              report.push(`NO DOWNLOAD FROM: ${label}`);
            }
            if (downloadIndex < candidateTexts.length) {
              const maybeExport = page.locator('button, a, [role="button"]').filter({ hasText: /^\s*Export Preset\s*$/i }).first();
              if (await maybeExport.count()) {
                await maybeExport.click({ timeout: 10000 }).catch(() => {});
                await page.waitForTimeout(600);
              }
            }
          }

          report.push(`INTERESTING RESPONSES:\n${JSON.stringify(responses, null, 2)}`);
          fs.writeFileSync('magpie-export-report.txt', report.join('\n\n'));
          await browser.close();
          JS
          node export-magpie.mjs
          find magpie-export-candidates -type f -print0 | sort -z | xargs -0 -r sha256sum > magpie-export-hashes.txt
          cat magpie-export-hashes.txt
      - name: Accept only an exact byte match
        shell: bash
        run: |
          set -euo pipefail
          expected='eb63f6bb8bd845dd4e1020ca9bd8c9f566f6c47022a6175b94dd01e055b8d941'
          exact=''
          while IFS= read -r -d '' candidate; do
            actual="$(sha256sum "$candidate" | cut -d' ' -f1)"
            if [ "$actual" = "$expected" ]; then
              exact="$candidate"
              break
            fi
          done < <(find magpie-export-candidates -type f -print0)

          git config user.name NemoVonNirgend
          git config user.email 207980572+NemoVonNirgend@users.noreply.github.com

          if [ -n "$exact" ]; then
            mkdir -p Magpie
            cp "$exact" 'Magpie/Magpie v1 Beta-2.1.json'
            test "$(wc -c < 'Magpie/Magpie v1 Beta-2.1.json')" -eq 313003
            python3 -m json.tool 'Magpie/Magpie v1 Beta-2.1.json' >/dev/null
            rm -rf node_modules package.json package-lock.json export-magpie.mjs magpie-export-candidates
            rm -f magpie-export-report.txt magpie-export-hashes.txt .github/workflows/export-magpie-json.yml
            rmdir .github/workflows 2>/dev/null || true
            rmdir .github 2>/dev/null || true
            git add -A
            git commit -m 'Add Magpie preset'
            git push
          else
            rm -rf node_modules package.json package-lock.json export-magpie.mjs
            git add magpie-export-report.txt magpie-export-hashes.txt magpie-export-candidates
            git commit -m 'Inspect Magpie export formats'
            git push
            exit 1
          fi
